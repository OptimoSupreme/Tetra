name: Build Tetra

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: tetra
  IMAGE_REGISTRY: ghcr.io/optimosupreme
  IMAGE_REF: ghcr.io/optimosupreme/tetra
  BASE_IMAGE: quay.io/fedora/fedora-bootc:44

jobs:
  build-container:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: true

      - name: Compute metadata
        id: meta
        run: |
          DATE=$(date -u +%Y%m%d)
          echo "tags=main main-${DATE}" >> "$GITHUB_OUTPUT"

      - name: Pull base image
        run: |
          for attempt in 1 2 3 4 5; do
            if podman pull "${BASE_IMAGE}"; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "Pull of ${BASE_IMAGE} failed after 5 attempts" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Pull of ${BASE_IMAGE} failed, retrying in ${delay}s (attempt $((attempt+1))/5)..." >&2
            sleep "$delay"
          done

      # TEMP FIX: the runner image ships fuse-overlayfs and buildah-build
      # force-selects it when present, which intermittently corrupts the
      # image rpmdb (sqlite) during dnf transactions. Removing the binary
      # makes buildah use native kernel overlayfs. Remove this step once
      # https://github.com/containers/fuse-overlayfs/issues/475 is resolved.
      - name: Remove fuse-overlayfs
        run: |
          while p=$(command -v fuse-overlayfs 2>/dev/null); do sudo rm -f "$p"; done

      - name: Build container image
        uses: redhat-actions/buildah-build@v3.0.2
        with:
          containerfiles: ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          oci: true
          # v3 defaults squash to true; keep layers for differential bootc pulls
          squash: false
          extra-args: --pull=missing

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -e
          digestfile="$(mktemp)"
          for tag in $TAGS; do
            for attempt in 1 2 3 4 5; do
              if podman push --quiet --digestfile "$digestfile" \
                   "${IMAGE_NAME}:${tag}" \
                   "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}" --tls-verify=true; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo "Push of ${tag} failed after 5 attempts" >&2
                exit 1
              fi
              delay=$((attempt * 15))
              echo "Push of ${tag} failed, retrying in ${delay}s (attempt $((attempt+1))/5)..." >&2
              sleep "$delay"
            done
          done
          echo "digest=$(cat "$digestfile")" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign container image
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          SIG_TAG="$(cosign triangulate "${IMAGE_REF}@${DIGEST}")"
          if skopeo inspect "docker://${SIG_TAG}" >/dev/null 2>&1; then
            echo "Signature already exists for ${DIGEST}, skipping."
          else
            cosign sign --yes "${IMAGE_REF}@${DIGEST}"
          fi

  cleanup:
    needs: build-container
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Prune old container versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: /users/${{ github.repository_owner }}/packages/container/tetra
          KEEP: 30
        run: |
          set -euo pipefail
          # Pair each version id with its created_at, keep the newest $KEEP
          # (ISO-8601 sorts chronologically), and delete everything older.
          gh api --paginate "${PKG}/versions?per_page=100" \
            --jq '.[] | [.created_at, (.id|tostring)] | @tsv' > versions.tsv
          ids=$(sort -r versions.tsv | tail -n +$((KEEP + 1)) | cut -f2)
          if [ -z "$ids" ]; then
            echo "Nothing to prune (<= ${KEEP} versions)."
            exit 0
          fi
          echo "Pruning $(printf '%s\n' "$ids" | grep -c .) version(s), keeping newest ${KEEP}."
          printf '%s\n' "$ids" | while read -r id; do
            [ -n "$id" ] || continue
            echo "Deleting version ${id}"
            gh api --method DELETE "${PKG}/versions/${id}"
          done
