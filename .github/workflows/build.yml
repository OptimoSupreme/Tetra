name: Build Tetra

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: tetra
  IMAGE_REGISTRY: ghcr.io/optimosupreme
  IMAGE_REF: ghcr.io/optimosupreme/tetra

jobs:
  build-container:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: true

      - name: Compute metadata
        id: meta
        run: |
          DATE=$(date -u +%Y%m%d)
          echo "tags=workstation workstation-${DATE} latest" >> "$GITHUB_OUTPUT"

      - name: Build container image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          oci: true

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign container image
        run: |
          cosign sign --yes "${IMAGE_REF}@${{ steps.push.outputs.digest }}"
