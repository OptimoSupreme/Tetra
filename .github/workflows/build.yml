name: Build Tetra

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: tetra
  IMAGE_REGISTRY: ghcr.io/optimosupreme
  IMAGE_REF: ghcr.io/optimosupreme/tetra

jobs:
  build-container:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: true

      - name: Compute metadata
        id: meta
        run: |
          DATE=$(date -u +%Y%m%d)
          echo "tags=main main-${DATE}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          oci: true

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -e
          digestfile="$(mktemp)"
          for tag in $TAGS; do
            for attempt in 1 2 3 4 5; do
              if podman push --quiet --digestfile "$digestfile" \
                   "${IMAGE_NAME}:${tag}" \
                   "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}" --tls-verify=true; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo "Push of ${tag} failed after 5 attempts" >&2
                exit 1
              fi
              delay=$((attempt * 15))
              echo "Push of ${tag} failed, retrying in ${delay}s (attempt $((attempt+1))/5)..." >&2
              sleep "$delay"
            done
          done
          echo "digest=$(cat "$digestfile")" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign container image
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          SIG_TAG="$(cosign triangulate "${IMAGE_REF}@${DIGEST}")"
          if skopeo inspect "docker://${SIG_TAG}" >/dev/null 2>&1; then
            echo "Signature already exists for ${DIGEST}, skipping."
          else
            cosign sign --yes "${IMAGE_REF}@${DIGEST}"
          fi

  cleanup:
    needs: build-container
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Prune old container versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: tetra
          package-type: container
          min-versions-to-keep: 30
