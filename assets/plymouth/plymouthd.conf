# Tetra plymouth configuration; overrides /usr/share/plymouth/plymouthd.defaults
[Daemon]
Theme=tetra
ShowDelay=0
DeviceTimeout=8
# Always start on the simpledrm framebuffer so the splash appears immediately,
# even on LUKS systems (the distro default UseSimpledrmNoLuks would wait up to
# DeviceTimeout for the native GPU driver before showing the unlock dialog)
UseSimpledrm=1
