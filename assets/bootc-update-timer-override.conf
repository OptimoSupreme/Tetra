[Timer]
# Reset upstream's monotonic schedule (OnBootSec=1h, OnUnitInactiveSec=8h).
# An empty assignment to any timer option clears the whole list, both monotonic
# and calendar entries, so this one line drops both. It must precede OnCalendar=
# below or it would clear that too.
OnBootSec=

# Check once a day at 10:00 local. Tetra builds at 07:00 UTC and Tetra-Tailored
# layers on top at 11:00 UTC, so 10:00 Eastern lands after both have published.
OnCalendar=*-*-* 10:00

# Upstream sets 2h of jitter to spread load across a large fleet; that would
# smear the 10:00 check across the whole morning for no benefit here.
RandomizedDelaySec=0

# Only has an effect on OnCalendar= timers. Monotonic timers don't advance
# while suspended, so the old schedule silently stretched across sleep; this
# catches up the missed run once the machine is awake.
Persistent=true
